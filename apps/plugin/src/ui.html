<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DesignForge</title>
  <style>
    :root {
      --bg: var(--figma-color-bg, #ffffff);
      --text: var(--figma-color-text, #1e1e1e);
      --text-secondary: var(--figma-color-text-secondary, #757575);
      --border: var(--figma-color-border, #e5e5e5);
      --primary: #18a0fb;
      --primary-hover: #0d8de3;
      --surface: var(--figma-color-bg-secondary, #f5f5f5);
      --success: #10b981;
      --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-size: 12px;
      line-height: 1.4;
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #18a0fb 0%, #7b61ff 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 11px;
    }

    .brand-title {
      font-weight: 600;
      font-size: 13px;
    }

    .version-tag {
      font-size: 10px;
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-secondary);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .selection-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .node-name {
      font-weight: 600;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 240px;
    }

    .node-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 14px;
      font-weight: 500;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-bottom: 12px;
    }

    .metric-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 4px;
      text-align: center;
    }

    .metric-value {
      font-weight: 700;
      font-size: 14px;
      color: var(--primary);
    }

    .metric-label {
      font-size: 9px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .tab-btn {
      padding: 6px 12px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--text);
      border-color: var(--primary);
      font-weight: 600;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      background: var(--surface);
    }

    .component-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .component-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 9px;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      text-transform: uppercase;
    }

    .component-spec {
      font-size: 11px;
      color: var(--text-secondary);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 6px;
    }

    .spec-item b {
      color: var(--text);
    }

    pre {
      font-family: monospace;
      font-size: 10.5px;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: var(--text-secondary);
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo-icon">DF</div>
      <div class="brand-title">DesignForge</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span class="version-tag" id="modeTag" style="font-weight: 600; text-transform: uppercase;">DESIGN MODE</span>
      <div class="version-tag">v0.1</div>
    </div>
  </header>

  <!-- Selection Card -->
  <div class="card" id="selectionCard">
    <div class="card-title">Selected Canvas Element</div>
    <div class="selection-info">
      <div>
        <div class="node-name" id="nodeName">No Selection</div>
        <div class="node-meta" id="nodeMeta">Select a Frame or Component</div>
      </div>
      <span class="badge" id="nodeTypeBadge">None</span>
    </div>
  </div>

  <button class="btn btn-primary" id="generateBtn" disabled>
    <span>⚡ Generate Complete DESIGN_SYSTEM.md</span>
  </button>

  <div id="resultsSection" style="display: none; flex: 1; flex-direction: column; margin-top: 14px; overflow: hidden;">
    <!-- Metrics Grid -->
    <div class="metrics-grid">
      <div class="metric-box">
        <div class="metric-value" id="compCount">0</div>
        <div class="metric-label">Elements</div>
      </div>
      <div class="metric-box">
        <div class="metric-value" id="assetCount">0</div>
        <div class="metric-label">Assets</div>
      </div>
      <div class="metric-box">
        <div class="metric-value" id="colorCount">0</div>
        <div class="metric-label">Colors</div>
      </div>
      <div class="metric-box">
        <div class="metric-value" id="typoCount">0</div>
        <div class="metric-label">Typography</div>
      </div>
      <div class="metric-box">
        <div class="metric-value" id="spacingCount">0</div>
        <div class="metric-label">Spacings</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tabPreviewBtn">Components</button>
      <button class="tab-btn" id="tabMarkdownBtn">DESIGN_SYSTEM.md</button>
    </div>

    <!-- Content Area -->
    <div class="content-area" id="contentArea">
      <div id="componentsView"></div>
      <div id="markdownView" style="display: none;">
        <pre><code id="markdownCode"></code></pre>
      </div>
    </div>

    <!-- Action Bar -->
    <div class="actions">
      <button class="btn btn-secondary" id="copyBtn">📋 Copy Markdown</button>
      <button class="btn btn-primary" id="downloadBtn">💾 Download .md</button>
    </div>
  </div>

  <script>
    let currentDoc = null;
    let currentMarkdown = '';

    const generateBtn = document.getElementById('generateBtn');
    const nodeNameEl = document.getElementById('nodeName');
    const nodeMetaEl = document.getElementById('nodeMeta');
    const nodeTypeBadge = document.getElementById('nodeTypeBadge');
    const resultsSection = document.getElementById('resultsSection');
    const compCountEl = document.getElementById('compCount');
    const assetCountEl = document.getElementById('assetCount');
    const colorCountEl = document.getElementById('colorCount');
    const typoCountEl = document.getElementById('typoCount');
    const spacingCountEl = document.getElementById('spacingCount');
    const componentsView = document.getElementById('componentsView');
    const markdownView = document.getElementById('markdownView');
    const markdownCode = document.getElementById('markdownCode');
    const tabPreviewBtn = document.getElementById('tabPreviewBtn');
    const tabMarkdownBtn = document.getElementById('tabMarkdownBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // Tab switcher
    tabPreviewBtn.addEventListener('click', () => {
      tabPreviewBtn.classList.add('active');
      tabMarkdownBtn.classList.remove('active');
      componentsView.style.display = 'block';
      markdownView.style.display = 'none';
    });

    tabMarkdownBtn.addEventListener('click', () => {
      tabMarkdownBtn.classList.add('active');
      tabPreviewBtn.classList.remove('active');
      componentsView.style.display = 'none';
      markdownView.style.display = 'block';
    });

    // Request generation
    generateBtn.addEventListener('click', () => {
      generateBtn.disabled = true;
      generateBtn.innerText = '⏳ Extracting Design System...';
      parent.postMessage({ pluginMessage: { type: 'GENERATE_DESIGN_SYSTEM' } }, '*');
    });

    // Copy to clipboard
    copyBtn.addEventListener('click', () => {
      if (!currentMarkdown) return;
      navigator.clipboard.writeText(currentMarkdown).then(() => {
        parent.postMessage({ pluginMessage: { type: 'NOTIFY', payload: '✓ Copied DESIGN_SYSTEM.md to clipboard!' } }, '*');
      });
    });

    // Download .md file
    downloadBtn.addEventListener('click', () => {
      if (!currentMarkdown) return;
      const blob = new Blob([currentMarkdown], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(currentDoc?.name || 'DESIGN_SYSTEM').toLowerCase().replace(/[^a-z0-9]/g, '-')}-design-system.md`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Handle messages from Figma sandbox (main.ts)
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg.type === 'AUTO_DOWNLOAD') {
        const { filename, content } = msg.payload;
        const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        document.body.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center; font-family:Inter, sans-serif; padding:16px;">
            <div style="font-size:24px; margin-bottom:8px;">✅</div>
            <div style="font-weight:600; font-size:13px; margin-bottom:4px;">Downloaded Successfully!</div>
            <div style="font-size:11px; color:var(--text-secondary);">${filename}</div>
          </div>
        `;
        parent.postMessage({ pluginMessage: { type: 'NOTIFY', payload: `✓ Successfully downloaded ${filename}` } }, '*');
        return;
      }

      if (msg.type === 'SELECTION_STATE') {
        const modeTag = document.getElementById('modeTag');
        if (msg.editorType === 'dev') {
          modeTag.innerText = 'DEV MODE';
          modeTag.style.background = '#e6f4ea';
          modeTag.style.color = '#137333';
        } else {
          modeTag.innerText = 'DESIGN MODE';
          modeTag.style.background = 'var(--surface)';
          modeTag.style.color = 'var(--text-secondary)';
        }

        if (!msg.hasSelection) {
          nodeNameEl.innerText = 'No Selection';
          nodeMetaEl.innerText = 'Select a Frame or Component on canvas';
          nodeTypeBadge.innerText = 'NONE';
          generateBtn.disabled = true;
        } else {
          const n = msg.node;
          nodeNameEl.innerText = n.name;
          nodeMetaEl.innerText = `${n.width} × ${n.height} px`;
          nodeTypeBadge.innerText = n.type;
          generateBtn.disabled = false;
        }
      }

      if (msg.type === 'GENERATE_SUCCESS') {
        generateBtn.disabled = false;
        generateBtn.innerText = '⚡ Re-generate DESIGN_SYSTEM.md';
        resultsSection.style.display = 'flex';

        const { doc, markdown, summary } = msg.payload;
        currentDoc = doc;
        currentMarkdown = markdown;

        compCountEl.innerText = summary.componentsCount;
        assetCountEl.innerText = summary.assetsCount ?? 0;
        colorCountEl.innerText = summary.colorCount;
        typoCountEl.innerText = summary.typographyCount;
        spacingCountEl.innerText = summary.spacingCount;

        markdownCode.innerText = markdown;

        // Render Components View
        componentsView.innerHTML = '';
        if (doc.componentInventory.length === 0) {
          componentsView.innerHTML = '<p style="color: var(--text-secondary); text-align:center;">No sub-components found.</p>';
        } else {
          doc.componentInventory.forEach((comp) => {
            const row = document.createElement('div');
            row.className = 'component-row';

            const pad = comp.layout.padding;
            const padStr = `${pad.top}px ${pad.right}px ${pad.bottom}px ${pad.left}px`;
            const bgStr = comp.backgrounds.map((b) => b.hex).join(', ') || 'None';
            const typoStr = comp.typography ? `${comp.typography.fontFamily} ${comp.typography.fontWeight} (${comp.typography.fontSize}px)` : 'None';

            row.innerHTML = `
              <div class="component-header">
                <span>${comp.name}</span>
                <span class="badge">${comp.type}</span>
              </div>
              <div class="component-spec">
                <div class="spec-item">Size: <b>${comp.dimensions.width}×${comp.dimensions.height}px</b></div>
                <div class="spec-item">Padding: <b>${padStr}</b></div>
                <div class="spec-item">Gap: <b>${comp.layout.itemSpacing}px</b></div>
                <div class="spec-item">Fill: <b>${bgStr}</b></div>
                <div class="spec-item" style="grid-column: span 2;">Font: <b>${typoStr}</b></div>
              </div>
            `;
            componentsView.appendChild(row);
          });
        }
      }

      if (msg.type === 'GENERATE_ERROR') {
        generateBtn.disabled = false;
        generateBtn.innerText = '⚡ Generate Complete DESIGN_SYSTEM.md';
      }
    };
  </script>
</body>
</html>
